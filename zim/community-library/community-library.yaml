apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: zim
  labels:
    app: community-library-app
  name: community-library-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: community-library-app
  template:
    metadata:
      labels:
        app: community-library-app
    spec:
      initContainers:
      - image: docker.io/busybox
        name: create-empty-library
        command: ["/bin/sh", "-c", 'echo -e "<library version=\"20110515\">\n</library>" > /library/catalog.xml']
        # command: ["/bin/sh", "-c", 'echo -e "<?xml version="1.0" encoding="UTF-8"?><feed></feed>" > /library/catalog.xml']
        volumeMounts:
        - mountPath: "/library"
          name: catalog-volume
          readOnly: false
        resources:
          requests:
            memory: "16Mi"
            cpu: "1m"
          limits:
            memory: "16Mi"
            cpu: "1m"
      containers:
      - image: ghcr.io/kiwix/catalog-retriever:kiwix-catalog
        imagePullPolicy: Always
        name: catalog-retriever
        env:
          - name: SAVE_TO
            value: /library/catalog.xml
          - name: CMS_API_URL
            value: http://api-service.cms.svc.cluster.local/v1
          - name: CMS_COLLECTION_ID
            value: Community
          - name: REFRESH_EVERY_SECONDS
            value: "300"
          - name: ADD_BOOK_PATH_TO_XML
            value: "/data/zim"
          - name: DEBUG
            value: ""
        volumeMounts:
        - mountPath: "/library"
          name: catalog-volume
          readOnly: false
        resources:
          requests:
            memory: "128Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "20m"
      - image: ghcr.io/kiwix/kiwix-tools:3.8.2
        imagePullPolicy: Always
        command: ["kiwix-serve", "-b", "--library", "--monitorLibrary", "--threads", "16", "--searchLimit", "5", "--nodatealias", "--customIndex", "/data/kiwix-serve-templates/index-template.html", "/library/catalog.xml"]
        name: kiwix-tools
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: "/data/zim"
          name: zim-volume
          readOnly: true
        - mountPath: "/library"
          name: catalog-volume
          readOnly: true
        - mountPath: "/data/kiwix-serve-templates"
          subPath: kiwix-serve-templates
          name: community-volume
          readOnly: true
        resources:
          requests:
            memory: "1Gi"
            cpu: "20m"
          limits:
            memory: "2.5Gi"
            cpu: "800m"
      volumes:
      - name: catalog-volume
        emptyDir:
          sizeLimit: 30Mi
          medium: Memory
      - name: zim-volume
        persistentVolumeClaim:
          claimName: browser-zim-pvc
      - name: community-volume
        hostPath:
          path: /data/community-volatile
      nodeSelector:
        k8s.kiwix.org/role: "browser"
---
apiVersion: v1
kind: Service
metadata:
  namespace: zim
  name: community-library-service
  labels:
    app: community-library-app
spec:
  selector:
    app: community-library-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
