            <div class="extra">
                <p>This requires Javascript and Cookies to be enabled (content you're looking for already requires
                    JS).</p>
                <p>You shall be prompted only once a week, given you keep the cookie.</p>
            </div>
        </main>
    </body>

    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: zim
  labels:
    app: nanobis-app
  name: nanobis-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nanobis-app
  template:
    metadata:
      labels:
        app: nanobis-app
    spec:
      containers:
      - name: nanobis
        image: nginx:stable
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        volumeMounts:
        - name: configs
          mountPath: "/usr/share/nginx/html/nanobis-manual-1w.html"
          subPath: nanobis-manual-1w.html
          readOnly: true
        - name: configs
          mountPath: "/usr/share/nginx/html/nanobis-auto-1w.html"
          subPath: nanobis-auto-1w.html
          readOnly: true
      volumes:
      - name: configs
        configMap:
          name: nanobis-configs
          defaultMode: 0755
      nodeSelector:
        k8s.kiwix.org/role: "browser"
---
apiVersion: v1
kind: Service
metadata:
  namespace: zim
  name: nanobis-service
  labels:
    app: nanobis-app
spec:
  selector:
    app: nanobis-app
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
