apiVersion: v1
kind: ConfigMap
metadata:
  name: mirror-configs
  namespace: zim
data:
  vhost.conf: |
    server {
      listen 80;
      server_name _;
      access_log /var/log/nginx/access.log vhost;
      access_log /dev/stdout vhost;
      root /var/www;
      default_type application/octet-stream;
      autoindex on;
      autoindex_exact_size off;
      autoindex_localtime off;

      gzip off;
      error_page   500 502 503 504  /50x.html;
      location = /50x.html {
          root   /usr/share/nginx/html;
      }
      location = /README {
        types { } default_type "text/plain; charset=utf-8";
      }

      location /zim {
        autoindex off;
      }
    }
  README: |
    mirror.download.kiwix.org: a ZIM mirror.

    This is a standard Kiwix mirror located in Paris (AS12876, Scaleway PAR2).

    Please use https://lb.download.kiwix.org/zim/ to be redirected to the
    most appropriate mirror.

    Please consider downloading via torrents as this spread the bandwidth requirements
    over all the torrent peers.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: zim
  labels:
    app: mirror-app
  name: mirror-http-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mirror-app
  template:
    metadata:
      labels:
        app: mirror-app
    spec:
      shareProcessNamespace: true
      containers:
      - image: docker.io/nginx:1.21
        imagePullPolicy: IfNotPresent
        name: nginx
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: "/var/www/zim"
          name: zim-volume
          readOnly: true
        - mountPath: "/var/log/nginx"
          subPath: mirror-download-kiwix
          name: nginx-logs-volume
          readOnly: false
        - name: configs
          mountPath: "/var/www/README"
          subPath: README
          readOnly: true
        - name: configs
          mountPath: "/etc/nginx/conf.d/default.conf"
          subPath: vhost.conf
          readOnly: true
        - name: nginx-configs
          mountPath: "/etc/nginx/mime.types"
          subPath: mime.types
          readOnly: true
        - name: nginx-configs
          mountPath: "/etc/nginx/conf.d/gzip.conf"
          subPath: gzip.conf
          readOnly: true
        - name: nginx-configs
          mountPath: "/etc/nginx/conf.d/01vhost-logfmt.conf"
          subPath: vhost-logfmt.conf
          readOnly: true
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
      volumes:
      - name: zim-volume
        persistentVolumeClaim:
          claimName: mirror-zim-pvc
      - name: nginx-logs-volume
        persistentVolumeClaim:
          claimName: mirror-www-logs-pvc
      - name: configs
        configMap:
          name: mirror-configs
      - name: nginx-configs
        configMap:
          name: nginx-configs
      - name: nginx-configs-scripts
        configMap:
          name: nginx-configs
          defaultMode: 0755
      nodeSelector:
        k8s.kiwix.org/role: "mirror"
---
apiVersion: v1
kind: Service
metadata:
  namespace: zim
  name: mirror-service
  labels:
    app: mirror-app
spec:
  selector:
    app: mirror-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mirror-ingress
  namespace: zim
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/server-snippet: |
      # CORS for Kiwix-JS
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, User-Agent, Range" always;
      add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
      add_header Access-Control-Allow-Credentials "true" always;

      # Frame ancestors for both sites
      add_header Content-Security-Policy "frame-ancestors 'self' https://browser-extension.kiwix.org https://pwa.kiwix.org https://kiwix.github.io http://localhost:* moz-extension: chrome-extension:" always;

      # Handle preflight requests
      if ($request_method = 'OPTIONS') {
          return 204;
      }
      
      location /robots.txt {
        add_header Content-Type "text/plain";
        return 200 "User-agent: *\nDisallow: /";
      }

      # redirect root and zim root to user-friendly page on Hub
      rewrite ^/zim/$  https://hub.kiwix.org/downloads/ permanent;
      # except the minibrain probe that should go through
      if ($http_user_agent !~ probe_info) {
        rewrite ^/$  https://hub.kiwix.org/downloads/ permanent;
      }
      rewrite ^/release/(.*) https://master.download.kiwix.org/release/$1 permanent;
      rewrite ^/nightly/(.*) https://master.download.kiwix.org/nightly/$1 permanent;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - mirror.download.kiwix.org
      secretName: mirror-download-kiwix-org-tls
  rules:
  - host: mirror.download.kiwix.org
    http:
      paths:
      - path: /library/library_zim.xml
        pathType: Exact
        backend:
          service:
            name: obsolete-library-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mirror-service
            port:
              number: 80
