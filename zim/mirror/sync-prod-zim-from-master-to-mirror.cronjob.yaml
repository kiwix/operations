apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-prod-zim-from-master-to-mirror
  namespace: zim
spec:
  schedule: "* * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          containers:
            - name: debian
              image: ghcr.io/kiwix/maintenance:latest
              imagePullPolicy: Always
              volumeMounts:
              - mountPath: "/data/zim"
                name: zim-volume
                readOnly: false
              args: ["rsync", "--verbose", "--compress", "--recursive", "--links", "--perms", "--times", "--devices", "--specials", "--delete", "--progress", "--include", "*.zim", "--include", "*/", "--exclude", "*", "master.download.kiwix.org::master.download.kiwix.org/zim/", "/data/zim/"]
              resources:
                limits:
                  cpu: 1000m
                  memory: 4Gi
          volumes:
          - name: zim-volume
            persistentVolumeClaim:
              claimName: mirror-zim-pvc
          restartPolicy: Never
          nodeSelector:
            k8s.kiwix.org/role: "mirror"
