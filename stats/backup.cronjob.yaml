apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-db
  namespace: stats
spec:
  schedule: "0 1 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          containers:
            - name: borg-backup
              image: ghcr.io/kiwix/borg-backup:latest
              imagePullPolicy: Always
              volumeMounts:
              - name: files-volume
                mountPath: "/storage"
                readOnly: true
              env:
                - name: BORGBASE_NAME
                  value: "matomo-db"
                - name: DATABASES
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: DATABASES
                - name: BITWARDEN_EMAIL
                  value: "contact+bitwarden-slave@kiwix.org"
                - name: BW_CLIENTID
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: BW_CLIENTID
                - name: BW_CLIENTSECRET
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: BW_CLIENTSECRET
                - name: BW_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: BW_PASSWORD
              command: ["single-backup"]
              resources:
                requests:
                  cpu: 300m
                  memory: 256Mi
                limits:
                  memory: 512Mi
          volumes:
          - name: files-volume
            emptyDir: {}
          restartPolicy: Never
          nodeSelector:
            k8s.kiwix.org/role: "hotspot-dl"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-files
  namespace: stats
spec:
  schedule: "0 1 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          containers:
            - name: borg-backup
              image: ghcr.io/kiwix/borg-backup:latest
              imagePullPolicy: Always
              volumeMounts:
              - name: files-volume
                mountPath: "/storage"
                readOnly: true
              env:
                - name: BORGBASE_NAME
                  value: "matomo-files"
                - name: BITWARDEN_EMAIL
                  value: "contact+bitwarden-slave@kiwix.org"
                - name: BW_CLIENTID
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: BW_CLIENTID
                - name: BW_CLIENTSECRET
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: BW_CLIENTSECRET
                - name: BW_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: BW_PASSWORD
              command: ["single-backup"]
              resources:
                requests:
                  cpu: 300m
                  memory: 256Mi
                limits:
                  memory: 512Mi
          volumes:
          - name: files-volume
            persistentVolumeClaim:
              claimName: stats-matomo-files-pvc
          restartPolicy: Never
          nodeSelector:
            k8s.kiwix.org/role: "stats"
