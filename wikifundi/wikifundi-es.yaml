apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: wikifundi
  labels:
    app: wikifundi-es-app
  name: wikifundi-es-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wikifundi-es-app
  template:
    metadata:
      labels:
        app: wikifundi-es-app
    spec:
      containers:
      - image: ghcr.io/offspot/wikifundi-es:latest
        imagePullPolicy: Always
        name: wikifundi
        env:
          - name: CLEAN
            value: "1"
          # - name: MIRRORING
          #   value: "1"
          # - name: MIRRORING_OPTIONS
          #   value: "-i WikiFundi/2021/"
          - name: DATABASE_NAME
            value: mw_wikifundi
        volumeMounts:
        - name: data-volume
          mountPath: "/var/www/data"
          readOnly: false
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "768Mi"
            cpu: "300m"
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: services-es-data-pvc
      nodeSelector:
        k8s.kiwix.org/role: "services"
---
apiVersion: v1
kind: Service
metadata:
  namespace: wikifundi
  name: wikifundi-es-service
  labels:
    app: wikifundi-es-app
spec:
  selector:
    app: wikifundi-es-app
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wikifundi-es-ingress
  namespace: wikifundi
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # https://kubernetes.github.io/ingress-nginx/examples/auth/basic/
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required - WikiFundi'
spec:
  tls:
    - hosts:
      - wikifundi-es.openzim.org
      secretName: wikifundi-es-openzim-org-tls
  rules:
  - host: wikifundi-es.openzim.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wikifundi-es-service
            port:
              name: http
