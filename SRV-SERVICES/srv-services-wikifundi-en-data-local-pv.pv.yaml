apiVersion: v1
kind: PersistentVolume
metadata:
  name: srv-services-wikifundi-en-data-local-pv
spec:
  capacity:
    storage: 12Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /data/wikifundi/en-data
  claimRef:
    name: services-en-data-pvc
    namespace: wikifundi
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: k8s.kiwix.org/role
              operator: In
              values:
              - services
