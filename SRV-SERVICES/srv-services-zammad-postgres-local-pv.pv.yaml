apiVersion: v1
kind: PersistentVolume
metadata:
  name: srv-services-zammad-postgres-local-pv
spec:
  capacity:
    storage: 8Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /data/zammad/postgres
  claimRef:
    name: services-zammad-postgres-pvc
    namespace: zammad
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: k8s.kiwix.org/role
              operator: In
              values:
              - services-new
