apiVersion: v1
kind: PersistentVolume
metadata:
  name: srv-services-test-webroot-local-pv
spec:
  capacity:
    storage: 10Mi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  local:
    path: /data/test/webroot
  claimRef:
    name: services-test-webroot-pvc
    namespace: test
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: k8s.kiwix.org/role
              operator: In
              values:
              - services
