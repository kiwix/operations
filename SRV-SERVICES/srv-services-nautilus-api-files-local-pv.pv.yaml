apiVersion: v1
kind: PersistentVolume
metadata:
  name: srv-services-nautilus-api-files-local-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /data/nautilus/files
  claimRef:
    name: services-api-files-pvc
    namespace: nautilus
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: k8s.kiwix.org/role
              operator: In
              values:
              - services-new
